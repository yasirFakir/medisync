version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: medisync-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: medisync_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medisync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: medisync-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - db

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: medisync-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgres://postgres@db:5432/medisync_db
      - JWT_SECRET=super_secret_key_for_testing
      - ENCRYPTION_KEY=12345678901234567890123456789012
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./apps/web-portals/Dockerfile
    container_name: medisync-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
